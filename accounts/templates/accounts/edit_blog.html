{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Blog - {{ blog.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .edit-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .edit-card {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .edit-header {
            padding: 28px 32px;
            border-bottom: 1px solid #eee;
            background: linear-gradient(135deg, #ffffff, #f8f9ff);
        }

        .edit-header h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .edit-header p {
            margin: 7px 0 0;
            color: #777;
            font-size: 14px;
        }

        .edit-body {
            padding: 32px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 13px;
            border: 1px solid #ddd;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12);
        }

        textarea.form-control {
            min-height: 250px;
            resize: vertical;
        }

        .current-image {
            margin-top: 12px;
        }

        .current-image img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .image-note {
            font-size: 13px;
            color: #777;
            margin-top: 6px;
        }

        .button-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid #eee;
        }

        .btn-custom {
            border-radius: 10px;
            padding: 11px 20px;
            font-weight: 600;
            text-decoration: none;
            border: none;
        }

        .btn-cancel {
            background: #f1f3f5;
            color: #444;
        }

        .btn-cancel:hover {
            background: #e2e6ea;
            color: #222;
        }

        .btn-update {
            background: #6c63ff;
            color: white;
        }

        .btn-update:hover {
            background: #574fd6;
            color: white;
        }

        @media (max-width: 600px) {

            .edit-wrapper {
                padding: 20px 10px;
            }

            .edit-header,
            .edit-body {
                padding: 22px;
            }

            .edit-header h2 {
                font-size: 23px;
            }

            .button-area {
                flex-direction: column-reverse;
                align-items: stretch;
            }

            .btn-custom {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="edit-wrapper">

    <div class="edit-card">

        <!-- Header -->
        <div class="edit-header">
            <h2>
                <i class="fa-solid fa-pen-to-square"></i>
                Edit Your Blog
            </h2>

            <p>
                Update your blog details and keep your story fresh.
            </p>
        </div>


        <!-- Form -->
        <div class="edit-body">

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}


                <!-- Title -->
                <div class="mb-4">

                    <label class="form-label">
                        Blog Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        value="{{ blog.title }}"
                        placeholder="Enter your blog title"
                        required>

                </div>


                <!-- Category -->
                <div class="mb-4">

                    <label class="form-label">
                        Category
                    </label>

                    <select name="category"
                            class="form-select"
                            required>

                        {% for value, label in categories %}

                            <option value="{{ value }}"
                                {% if blog.category == value %}selected{% endif %}>

                                {{ label }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Content -->
                <div class="mb-4">

                    <label class="form-label">
                        Blog Content
                    </label>

                    <textarea
                        name="content"
                        class="form-control"
                        placeholder="Write your blog content..."
                        required>{{ blog.content }}</textarea>

                </div>


                <!-- Image -->
                <div class="mb-4">

                    <label class="form-label">
                        Blog Image
                    </label>

                    <input
                        type="file"
                        name="image"
                        class="form-control"
                        accept="image/*">

                    {% if blog.image %}

                        <div class="current-image">

                            <p class="image-note">
                                Current image:
                            </p>

                            <img src="{{ blog.image.url }}"
                                 alt="Current blog image">

                        </div>

                    {% else %}

                        <p class="image-note">
                            No image has been added to this blog.
                        </p>

                    {% endif %}

                </div>


                <!-- Buttons -->
                <div class="button-area">

                    <a href="{% url 'blog_detail' blog.id %}"
                       class="btn-custom btn-cancel">

                        <i class="fa-solid fa-arrow-left"></i>
                        Cancel

                    </a>


                    <button type="submit"
                            class="btn-custom btn-update">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Update Blog

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
