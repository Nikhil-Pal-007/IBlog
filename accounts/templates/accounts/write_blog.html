{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Blog</title>
    <link rel="stylesheet" href="{% static 'accounts/write_blog.css' %}">

</head>

<body>

    <div class="write-container">
        <h2>Write Your Blog</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="category">Category</label>

            <select name="category" id="category" required>
                <option value="">Select Category</option>
                <option value="Technology">Technology</option>
                <option value="Travel">Travel</option>
                <option value="Food">Food</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Fitness">Fitness</option>
                <option value="Photography">Photography</option>
                <option value="Nature">Nature</option>
                <option value="PersonalStories">Personal Stories</option>
            </select>

            <div id="writing-suggestions"></div>
            
            {{ form.as_p }}


            <button type="submit" class="post-btn">
                Post
            </button>
        </form>
    </div>
    <script>
        const editor = document.getElementById("id_content");
        const suggestionsBox = document.getElementById("writing-suggestions");

        let typingTimer;

        editor.addEventListener("input", function () {

            clearTimeout(typingTimer);

            typingTimer = setTimeout(function () {
                checkWriting(editor.value);
            }, 800);

        });


        function checkWriting(text) {

            if (text.trim() === "") {
                suggestionsBox.innerHTML = "";
                return;
            }

            fetch("{% url 'check_writing' %}", {
                method: "POST",

                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": getCookie("csrftoken")
                },

                body: `text=${encodeURIComponent(text)}`
            })

                .then(response => {
                    console.log("Response status:", response.status);
                    return response.json();
                })
                .then(data => {
                    console.log("LanguageTool response:", data);
                    displaySuggestions(data.corrections);
                })
                .catch(error => {
                    console.error("Error:", error);
                });

        }


        function displaySuggestions(corrections) {

            suggestionsBox.innerHTML = "";

            corrections.forEach(function (correction) {

                const div = document.createElement("div");

                div.className = "suggestion";

                const message = document.createElement("strong");
                message.textContent = correction.message;

                div.appendChild(message);

                const text = document.createTextNode("Suggestions: ");
                div.appendChild(text);

                correction.suggestions.forEach(function (suggestion) {

                    const button = document.createElement("button");

                    button.textContent = suggestion;
                    button.className = "suggestion-btn";

                    button.addEventListener("click", function () {

                        const start = correction.offset;
                        const end = start + correction.length;

                        editor.value =
                            editor.value.substring(0, start) +
                            suggestion +
                            editor.value.substring(end);

                        displaySuggestions([]);
                    });

                    div.appendChild(button);
                });

                suggestionsBox.appendChild(div);
            });
        }


        function getCookie(name) {

            let cookieValue = null;

            if (document.cookie && document.cookie !== "") {

                const cookies = document.cookie.split(";");

                for (let cookie of cookies) {

                    cookie = cookie.trim();

                    if (cookie.startsWith(name + "=")) {

                        cookieValue = decodeURIComponent(
                            cookie.substring(name.length + 1)
                        );

                        break;
                    }
                }
            }

            return cookieValue;
        }
    </script>
</body>

</html>
